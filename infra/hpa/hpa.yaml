# CPU-based autoscaling for the stateless HTTP services.
#
# OPT-IN: not part of the default deploy. Enable on a cluster with headroom via
# the skaffold profile —  skaffold dev -p autoscale  — or apply directly:
#   kubectl apply -f infra/hpa/hpa.yaml      (disable: kubectl delete -f …)
# Left out by default because on a small single-node cluster the HPAs amplify
# the cold-start storm (services scale toward maxReplicas under the boot spike).
#
# Requires metrics-server in the cluster (k3s ships it by default; on a bare
# cluster install it separately). expiration is intentionally excluded — it must
# stay at a single replica to avoid duplicate delayed-job publishing.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-depl
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
