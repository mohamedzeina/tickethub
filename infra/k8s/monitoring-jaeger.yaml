# Jaeger all-in-one as the tracing backend. Modern Jaeger ships a native OTLP
# receiver (COLLECTOR_OTLP_ENABLED), so the services export straight to it over
# OTLP/HTTP (:4318) — no separate OpenTelemetry Collector needed. Traces live in
# memory (all-in-one default); fine for a local/demo cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: 'true'
          ports:
            - containerPort: 16686 # web UI
            - containerPort: 4318 # OTLP HTTP
            - containerPort: 4317 # OTLP gRPC
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-srv
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      protocol: TCP
      port: 16686
      targetPort: 16686
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
