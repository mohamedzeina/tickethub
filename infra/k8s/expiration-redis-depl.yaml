apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expiration-redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expiration-redis-depl
  labels:
    app: expiration-redis
spec:
  replicas: 1
  # Single-replica + RWO volume: avoid two pods contending for the disk on rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: expiration-redis
  template:
    metadata:
      labels:
        app: expiration-redis
    spec:
      containers:
        - name: expiration-redis
          image: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Enable AOF so scheduled expiration jobs survive a pod restart.
          command: ['redis-server', '--appendonly', 'yes']
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: expiration-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: expiration-redis-srv
spec:
  selector:
    app: expiration-redis
  ports:
    - name: expiration-redis-db
      protocol: TCP
      port: 6379
      targetPort: 6379
