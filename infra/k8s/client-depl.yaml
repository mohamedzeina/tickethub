apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-depl
spec:
  # next dev must run as a SINGLE instance: it keeps per-process build state, an
  # in-memory on-demand-compiled module map, and a per-process HMR socket. Behind
  # the round-robin ingress, two replicas split the browser's chunk/HMR/route
  # requests across two dev servers, which makes client-side route transitions
  # abort and revert. (The production image — next start, immutable build — can
  # scale to N replicas safely.)
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: client
          image: toxiczeina/client
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: '1'
              memory: 768Mi
          env:
            - name: NEXT_PUBLIC_STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_PUBLISHABLE_KEY
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']

---
apiVersion: v1
kind: Service
metadata:
  name: client-srv
spec:
  selector:
    app: client
  ports:
    - name: client
      protocol: TCP
      port: 3000
      targetPort: 3000
