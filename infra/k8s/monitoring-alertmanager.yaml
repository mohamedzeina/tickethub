# AlertManager receives firing alerts from Prometheus. No external notifier is
# wired for the local/demo cluster — the Watchdog routes to a null receiver, real
# alerts to a 'default' receiver (add slack/email/webhook configs here for prod).
# Inspect firing alerts in its UI (port-forward :9093) or via /api/v2/alerts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        # The Watchdog is noise for humans; swallow it (its value is being
        # forwarded at all — a dead-man's-switch would alert on its absence).
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"

    receivers:
      - name: 'null'
      - name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
          ports:
            - containerPort: 9093
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-srv
spec:
  selector:
    app: alertmanager
  ports:
    - name: web
      protocol: TCP
      port: 9093
      targetPort: 9093
