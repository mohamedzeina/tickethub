apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl
spec:
  # replicas managed by the HPA (auth-hpa); omitted so re-apply doesn't fight it
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/metrics'
      labels:
        app: auth
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          image: toxiczeina/auth
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          env:
            - name: SERVICE_NAME
              value: 'auth'
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: 'http://jaeger-srv:4318/v1/traces'
            # ts-node-dev type-checks at startup; the OTel type graph is huge and
            # OOMs the dev image. Skip runtime type-checking (tsc/CI still checks).
            - name: TS_NODE_TRANSPILE_ONLY
              value: 'true'
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: AUTH_MONGO_URI
            - name: NATS_URL
              value: 'nats://nats-srv:4222'
            - name: NATS_CLUSTER_ID
              value: 'tickethub'
            # Shared store for abuse-protection rate limits (#13). If this is
            # unreachable the limiter fails open, so auth still serves.
            - name: RATELIMIT_REDIS_HOST
              value: 'ratelimit-redis-srv'
            # DEV ONLY: lets the live e2e harness skip the limiter by sending a
            # matching x-ratelimit-bypass header, so repeated runs don't exhaust
            # the per-IP budgets. NEVER set this in prod — without it the bypass
            # header is inert. The abuse suite omits the header and still tests
            # the real limiter.
            - name: RATELIMIT_BYPASS_TOKEN
              value: 'e2e-bypass'
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']

---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
spec:
  selector:
    app: auth
  ports:
    - name: auth
      protocol: TCP
      port: 3000
      targetPort: 3000
