apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/metrics'
      labels:
        app: notifications
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notifications
          image: toxiczeina/notifications
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          env:
            - name: SERVICE_NAME
              value: 'notifications'
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: 'http://jaeger-srv:4318/v1/traces'
            # ts-node-dev type-checks at startup; the OTel type graph is huge and
            # OOMs the dev image. Skip runtime type-checking (tsc/CI still checks).
            - name: TS_NODE_TRANSPILE_ONLY
              value: 'true'
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: NOTIFICATIONS_MONGO_URI
            - name: NATS_URL
              value: 'nats://nats-srv:4222'
            - name: NATS_CLUSTER_ID
              value: 'tickethub'
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # #6: notifications now owns the transactional emails (receipt,
            # hold-expiring, hold-expired). Local → Mailpit; prod → a real relay.
            - name: MAIL_HOST
              value: 'mailpit-srv'
            - name: MAIL_PORT
              value: '1025'
            - name: MAIL_FROM
              value: 'TicketHub <no-reply@tickethub.com>'
            # #7: base URL used to build verify-email / reset-password links.
            - name: CLIENT_URL
              value: 'https://tickethub.com'
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-srv
spec:
  selector:
    app: notifications
  ports:
    - name: notifications
      protocol: TCP
      port: 3000
      targetPort: 3000
