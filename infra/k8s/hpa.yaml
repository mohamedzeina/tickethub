# CPU-based autoscaling for the stateless HTTP services.
# Requires metrics-server in the cluster (k3s ships it by default; on a bare
# cluster install it separately). expiration is intentionally excluded — it must
# stay at a single replica to avoid duplicate delayed-job publishing.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-depl
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
