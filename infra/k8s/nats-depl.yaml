apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-depl
spec:
  replicas: 1
  # Single-replica + RWO volume: avoid two pods contending for the disk on rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          # NATS 2.x with JetStream — the maintained successor to the EOL
          # nats-streaming server. JetStream supersedes the STAN file-store:
          # it persists streams, consumers and un-acked messages to disk.
          image: nats:2.10-alpine
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # -js enables JetStream; -sd points its file store at the PVC so
          # streams/consumers survive a pod restart; -m exposes monitoring.
          args:
            [
              '-p',
              '4222',
              '-m',
              '8222',
              '-js',
              '-sd',
              '/data',
            ]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nats-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nats-srv
spec:
  selector:
    app: nats
  ports:
    - name: client
      protocol: TCP
      port: 4222
      targetPort: 4222
    - name: monitoring
      protocol: TCP
      port: 8222
      targetPort: 8222
