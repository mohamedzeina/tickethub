apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/metrics'
      labels:
        app: reviews
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: reviews
          image: toxiczeina/reviews
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          env:
            - name: SERVICE_NAME
              value: 'reviews'
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: 'http://jaeger-srv:4318/v1/traces'
            # ts-node-dev type-checks at startup; the OTel type graph is huge and
            # OOMs the dev image. Skip runtime type-checking (tsc/CI still checks).
            - name: TS_NODE_TRANSPILE_ONLY
              value: 'true'
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: REVIEWS_MONGO_URI
            - name: NATS_URL
              value: 'nats://nats-srv:4222'
            - name: NATS_CLUSTER_ID
              value: 'tickethub'
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']

---
apiVersion: v1
kind: Service
metadata:
  name: reviews-srv
spec:
  selector:
    app: reviews
  ports:
    - name: reviews
      protocol: TCP
      port: 3000
      targetPort: 3000
