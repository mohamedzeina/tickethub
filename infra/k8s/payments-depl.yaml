apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-depl
spec:
  # replicas managed by the HPA (payments-hpa); omitted so re-apply doesn't fight it
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/metrics'
      labels:
        app: payments
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: payments
          image: toxiczeina/payments
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # Higher than the other services: the dev image type-checks the very
              # large Stripe type definitions via ts-node-dev (the compiled prod
              # image needs far less).
              memory: 1Gi
          env:
            - name: SERVICE_NAME
              value: 'payments'
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: 'http://jaeger-srv:4318/v1/traces'
            # ts-node-dev type-checks at startup; the OTel type graph is huge and
            # OOMs the dev image. Skip runtime type-checking (tsc/CI still checks).
            - name: TS_NODE_TRANSPILE_ONLY
              value: 'true'
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_WEBHOOK_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: PAYMENTS_MONGO_URI
            - name: NATS_URL
              value: 'nats://nats-srv:4222'
            - name: NATS_CLUSTER_ID
              value: 'tickethub'
            - name: NATS_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # 5a: receipt email. Local → Mailpit (no auth). Prod → swap these
            # for a real relay's host/port/creds (e.g. via a mail-secret).
            - name: MAIL_HOST
              value: 'mailpit-srv'
            - name: MAIL_PORT
              value: '1025'
            - name: MAIL_FROM
              value: 'TicketHub <no-reply@tickethub.com>'
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']

---
apiVersion: v1
kind: Service
metadata:
  name: payments-srv
spec:
  selector:
    app: payments
  ports:
    - name: payments
      protocol: TCP
      port: 3000
      targetPort: 3000
