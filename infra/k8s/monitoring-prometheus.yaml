# Prometheus: discovers pods via the Kubernetes API and scrapes any that carry
# the prometheus.io/scrape annotation (all five services + the NATS exporter).
# Data is kept in an emptyDir — fine for a local/demo cluster; swap for a PVC if
# long retention is needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: ['']
    resources: ['nodes', 'nodes/proxy', 'services', 'endpoints', 'pods']
    verbs: ['get', 'list', 'watch']
  - nonResourceURLs: ['/metrics']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager-srv:9093']

    scrape_configs:
      # Scrape Prometheus itself.
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Auto-discover annotated pods (services + nats-exporter).
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods opted in with prometheus.io/scrape: "true".
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Use the path from prometheus.io/path (default /metrics).
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Build address from pod IP + prometheus.io/port.
          - source_labels:
              [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Surface useful pod metadata as labels.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
data:
  alerts.yml: |
    groups:
      - name: tickethub
        rules:
          # Watchdog: always firing. Confirms the whole Prometheus→AlertManager
          # pipeline is alive; alerting on its *absence* is the dead-man's-switch.
          - alert: Watchdog
            expr: vector(1)
            labels:
              severity: none
            annotations:
              summary: Alerting pipeline is alive

          # D4: payment failure rate — payments failing relative to total volume.
          - alert: HighPaymentFailureRate
            expr: |
              sum(rate(payments_failed_total[5m]))
                / clamp_min(sum(rate(payments_succeeded_total[5m])) + sum(rate(payments_failed_total[5m])), 1)
                > 0.2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Payment failure rate above 20% over 10m'

          # D4: listener redelivery spike — events being nak'd/retried in bulk.
          - alert: ListenerRedeliverySpike
            expr: sum(rate(event_redeliveries_total[5m])) > 0.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Listener redeliveries spiking (events failing & retrying)'

          # Dead-letters are always worth a look.
          - alert: EventsDeadLettered
            expr: increase(events_processed_total{result="dead_letter"}[10m]) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: 'Poison events dead-lettered in the last 10m'

          # A service has no scrapeable replicas.
          - alert: ServiceDown
            expr: |
              count by (app) (up{app=~"auth|orders|payments|tickets|expiration"} == 1) == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Service {{ $labels.app }} has no healthy replicas'

          # Elevated 5xx rate on any service.
          - alert: HighHttpErrorRate
            expr: |
              sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
                / clamp_min(sum by (service) (rate(http_requests_total[5m])), 1)
                > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'HTTP 5xx rate above 5% on {{ $labels.service }}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=6h'
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-srv
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      protocol: TCP
      port: 9090
      targetPort: 9090
